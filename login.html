<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 我们的时光簿</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="page-login">

  <div class="decor d-heart" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="#F2767E" opacity="0.35"><path d="M12 21s-7-4.6-9.3-9A5.4 5.4 0 0 1 12 6.3 5.4 5.4 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg>
  </div>
  <div class="decor d-star1" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="#9DBE8B" opacity="0.5"><path d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z"/></svg>
  </div>
  <div class="decor d-star2" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="#8FB6CE" opacity="0.5"><path d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z"/></svg>
  </div>
  <div class="decor d-dot" aria-hidden="true"></div>

  <div class="login-card">
    <div class="login-head">
      <div class="seal-wrap">
        <img class="seal-photo" src="assets/img/decor/login.jpg" alt="我们的照片">
      </div>
      <h1>回到时光簿</h1>
      <div class="head-divider">
        <span class="line"></span>
        <svg viewBox="0 0 24 24" width="12" height="12" fill="#F2767E"><path d="M12 21s-7-4.6-9.3-9A5.4 5.4 0 0 1 12 6.3 5.4 5.4 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg>
        <span class="line"></span>
      </div>
      <p>只有我们知道的地方</p>
    </div>

    <div class="account-pick">
      <button type="button" class="account-btn" data-user="wenlinshu">
        <div class="ab-avatar">温</div>
        <div class="ab-name">温琳舒</div>
        <div class="ab-user">wenlinshu</div>
      </button>
      <button type="button" class="account-btn" data-user="yuzengyang">
        <div class="ab-avatar">于</div>
        <div class="ab-name">于增洋</div>
        <div class="ab-user">yuzengyang</div>
      </button>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="user">账号</label>
        <input class="input" id="user" name="user" autocomplete="username" placeholder="wenlinshu / yuzengyang">
      </div>
      <div class="field">
        <label for="pass">密码</label>
        <input class="input" id="pass" name="pass" type="password" autocomplete="current-password" placeholder="两个人的小秘密">
      </div>
      <div class="login-err" id="loginErr"></div>
      <div class="login-actions">
        <button class="btn btn-primary login-submit" type="submit">进入时光簿</button>
      </div>
    </form>

    <div class="login-back"><a href="index.html">← 回到展览页</a></div>
    <div class="hint-tip">账号密码只属于你们两个人，别告诉别人哦。</div>
  </div>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
